services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: campus_twin
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus-local-only
    ports:
      - "5432:5432"
    volumes:
      - campus-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus_twin"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    environment:
      CAMPUS_DATABASE_URL: postgresql+psycopg://campus:campus-local-only@db:5432/campus_twin
      CAMPUS_ASSISTANT_PROVIDER: demo
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build:
      context: .
      dockerfile: infra/Dockerfile.frontend
    environment:
      CAMPUS_API_PROXY: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api
volumes:
  campus-postgres:
