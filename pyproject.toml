[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="building-energy-hvac-digital-twin"
version="0.2.0"
description="Vendor-neutral, calibratable R&D digital twin for building energy and HVAC systems"
readme="README.md"
requires-python=">=3.10"
license={text="MIT"}
authors=[{name="Vicena Research Twins"}]
dependencies=["numpy>=1.24","pandas>=2.0","scipy>=1.10","matplotlib>=3.7","jsonschema>=4.18","pillow>=10"]
[project.optional-dependencies]
dev=["pytest>=7","nbclient>=0.8","nbformat>=5"]
campus=["fastapi>=0.115","uvicorn[standard]>=0.30","sqlalchemy>=2.0","psycopg[binary]>=3.2","httpx>=0.27"]
ml=["scikit-learn>=1.5","xgboost>=2.1"]
planning=["pymoo>=0.6.1"]
rl=["gymnasium>=1.0","ray[rllib]>=2.40"]
chat-bedrock=["boto3>=1.35"]
[project.scripts]
hvac-twin="building_hvac_twin.cli:main"
campus-twin="campus_twin.cli:main"
[tool.setuptools.packages.find]
where=["src", "."]
include=["building_hvac_twin*", "campus_twin*"]

[tool.setuptools.package-data]
campus_twin=["data/*.json"]
[tool.pytest.ini_options]
pythonpath=["src", "."]
testpaths=["tests"]
